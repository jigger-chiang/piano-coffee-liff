<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>咖啡券管理</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --brand:#5b3a29;
    --bg:#faf6f2;
    --card:#ffffff;
    --accent:#c98a4b;
    --topup:#4a6b5a;
    --ok:#2e7d32;
    --danger:#c0392b;
  }
  *{ box-sizing:border-box; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  .card{
    background:var(--card);
    border-radius:18px;
    padding:28px 24px;
    width:100%;
    max-width:360px;
    box-shadow:0 4px 20px rgba(91,58,41,0.12);
    text-align:center;
  }
  h1{ font-size:18px; color:var(--brand); margin:0 0 20px; font-weight:600; }
  button{
    border:none;
    border-radius:12px;
    padding:16px 24px;
    font-size:17px;
    width:100%;
    cursor:pointer;
    font-weight:600;
    color:#fff;
  }
  button:active{ opacity:0.85; }
  .btn-redeem{ background:var(--accent); }
  .btn-topup{ background:var(--topup); margin-top:12px; }
  button.secondary{ background:#eee; color:#555; margin-top:12px; }
  button.confirm{ background:var(--ok); margin-top:16px; }
  .result{ font-size:17px; font-weight:600; margin:12px 0 4px; }
  .result-ok{ color:var(--ok); }
  .result-fail{ color:var(--danger); }
  .detail{ font-size:14px; color:#777; margin-bottom:4px; }
  .loading{ color:#999; font-size:14px; padding:20px 0; }
  input[type=number]{
    width:100%;
    font-size:24px;
    text-align:center;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-top:12px;
  }
  .info-box{
    background:#f3f6f4;
    border-radius:10px;
    padding:12px;
    margin-top:12px;
    text-align:left;
    font-size:14px;
    color:#444;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>咖啡券管理</h1>
    <div id="content" class="loading">載入中...</div>
  </div>

<script>
// ===== 設定區：請依你的正式環境填入 =====
var LIFF_ID = '2011695600-I7fdK8tU';             // LINE Login Channel 底下店員端 LIFF App 的 ID
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyZv4lCLG68U4BNiZGZfQ9P8MYyZ_8yTTzfptubYpCR1q0gAB9IdjEYQcIBdba51pxg/exec'; // Apps Script 部署後的網址，結尾 /exec
// ==========================================

var staffPin = '';

function main() {
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    staffPin = window.prompt('請輸入店員核銷密碼') || '';
    renderHomeScreen();
  }).catch(function () {
    document.getElementById('content').innerHTML =
      '<div class="result result-fail">LIFF 初始化失敗，請確認是否用LINE App開啟本頁面</div>';
  });
}

function renderHomeScreen() {
  document.getElementById('content').innerHTML =
    '<button class="btn-redeem" id="redeemBtn">掃描兌換 QR Code</button>' +
    '<button class="btn-topup" id="topupBtn">掃描新增杯數 QR Code</button>';
  document.getElementById('redeemBtn').onclick = scanRedeem;
  document.getElementById('topupBtn').onclick = scanTopup;
}

function doScan() {
  if (!liff.scanCodeV2) {
    alert('此環境不支援掃描，請確認是用LINE App開啟本頁面');
    return Promise.reject('no scan');
  }
  return liff.scanCodeV2().then(function (result) {
    if (!result || !result.value) {
      return Promise.reject('cancelled');
    }
    return result.value;
  });
}

// ---------- 兌換流程 ----------

function scanRedeem() {
  doScan().then(redeem).catch(function () {});
}

function redeem(token) {
  var content = document.getElementById('content');
  content.innerHTML = '<div class="loading">核銷中...</div>';
  fetch(BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'redeem', token: token, staffPin: staffPin })
  }).then(function (res) { return res.json(); })
    .then(function (res) {
      if (res.ok) {
        content.innerHTML =
          '<div class="result result-ok">✅ 兌換成功</div>' +
          '<div class="detail">剩餘 ' + res.balance + ' 杯</div>' +
          '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
      } else {
        content.innerHTML =
          '<div class="result result-fail">❌ ' + (res.message || '核銷失敗') + '</div>' +
          '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
      }
    }).catch(function () {
      content.innerHTML =
        '<div class="result result-fail">網路異常，請稍後再試</div>' +
        '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
    });
}

// ---------- 新增杯數流程 ----------

function scanTopup() {
  doScan().then(identifyTopup).catch(function () {});
}

function identifyTopup(token) {
  var content = document.getElementById('content');
  content.innerHTML = '<div class="loading">識別中...</div>';
  fetch(BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'identifyTopup', token: token, staffPin: staffPin })
  }).then(function (res) { return res.json(); })
    .then(function (res) {
      if (res.ok) {
        renderTopupForm(res.line_user_id, res.phone, res.balance);
      } else {
        content.innerHTML =
          '<div class="result result-fail">❌ ' + (res.message || '識別失敗') + '</div>' +
          '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
      }
    }).catch(function () {
      content.innerHTML =
        '<div class="result result-fail">網路異常，請稍後再試</div>' +
        '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
    });
}

function renderTopupForm(lineUserId, phone, currentBalance) {
  var content = document.getElementById('content');
  content.innerHTML =
    '<div class="result result-ok">✅ 身份確認成功</div>' +
    '<div class="info-box">' +
      '聯絡電話：' + (phone || '（尚未登記）') + '<br>' +
      '目前餘額：' + currentBalance + ' 杯' +
    '</div>' +
    '<input type="number" id="amountInput" placeholder="請輸入新增杯數" min="1">' +
    '<button class="confirm" id="confirmBtn">確認新增</button>' +
    '<button class="secondary" onclick="renderHomeScreen()">取消</button>';

  document.getElementById('confirmBtn').onclick = function () {
    var amount = Number(document.getElementById('amountInput').value);
    if (!amount || amount <= 0) {
      alert('請輸入大於0的杯數');
      return;
    }
    submitTopup(lineUserId, amount);
  };
}

function submitTopup(lineUserId, amount) {
  var content = document.getElementById('content');
  content.innerHTML = '<div class="loading">新增中...</div>';
  fetch(BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'addPoints',
      lineUserId: lineUserId,
      amount: amount,
      staffPin: staffPin,
      note: '櫃檯掃碼新增'
    })
  }).then(function (res) { return res.json(); })
    .then(function (res) {
      if (res.ok) {
        content.innerHTML =
          '<div class="result result-ok">✅ 新增成功</div>' +
          '<div class="detail">已新增 ' + amount + ' 杯，目前共 ' + res.balance + ' 杯</div>' +
          '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
      } else {
        content.innerHTML =
          '<div class="result result-fail">❌ ' + (res.message || '新增失敗') + '</div>' +
          '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
      }
    }).catch(function () {
      content.innerHTML =
        '<div class="result result-fail">網路異常，請稍後再試</div>' +
        '<button class="secondary" onclick="renderHomeScreen()">回主畫面</button>';
    });
}

main();
</script>
</body>
</html>
